<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Лев-разработчик</title>
<desc id="d">Геометричный лев с ноутбуком и светящимся мечом</desc>
<style>
:root{--ink:#14141c;--face:#ffffff;--glow:#3b4cff}
@media (prefers-color-scheme:dark){:root{--ink:#f4f4f6;--face:#0b0b0f;--glow:#7b88ff}}
.ink{fill:var(--ink)}.face{fill:var(--face)}
.line{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.code{fill:none;stroke:var(--face);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.glow{fill:var(--glow)}
</style>
<defs><path id="s" d="M-15 -90 L0 -132 L15 -90Z"/></defs>

<!-- световой меч (за мордой и лапой) -->
<g transform="translate(352 372) rotate(20)">
<rect class="glow" x="-14" y="-210" width="28" height="196" rx="14" opacity=".22"/>
<rect class="glow" x="-8" y="-206" width="16" height="190" rx="8" opacity=".45"/>
<rect class="glow" x="-5" y="-204" width="10" height="188" rx="5"/>
<rect fill="#fff" x="-1.8" y="-200" width="3.6" height="180" rx="1.8"/>
<rect class="ink" x="-9" y="-16" width="18" height="10" rx="2"/>
<rect class="ink" x="-7" y="-6" width="14" height="46" rx="4"/>
<rect class="face" x="-7" y="6" width="14" height="3"/>
<rect class="face" x="-7" y="20" width="14" height="3"/>
</g>

<!-- грива -->
<g transform="translate(236 186)">
<g class="ink">
<use href="#s"/><use href="#s" transform="rotate(30)"/><use href="#s" transform="rotate(60)"/>
<use href="#s" transform="rotate(90)"/><use href="#s" transform="rotate(120)"/><use href="#s" transform="rotate(150)"/>
<use href="#s" transform="rotate(180)"/><use href="#s" transform="rotate(210)"/><use href="#s" transform="rotate(240)"/>
<use href="#s" transform="rotate(270)"/><use href="#s" transform="rotate(300)"/><use href="#s" transform="rotate(330)"/>
<circle r="104"/>
</g>
<!-- уши -->
<circle class="face" cx="-62" cy="-66" r="17"/><circle class="ink" cx="-62" cy="-66" r="7"/>
<circle class="face" cx="62" cy="-66" r="17"/><circle class="ink" cx="62" cy="-66" r="7"/>
<!-- морда -->
<circle class="face" r="80"/>
<path class="line" d="M-46 -26 L-14 -16 M46 -26 L14 -16"/>
<circle class="ink" cx="-28" cy="-6" r="7"/><circle class="ink" cx="28" cy="-6" r="7"/>
<path class="ink" d="M-15 12 Q0 6 15 12 L0 30Z"/>
<path class="line" d="M0 30 V42 M0 42 Q-12 54 -28 44 M0 42 Q12 54 28 44"/>
</g>

<!-- ноутбук -->
<rect class="ink" x="156" y="292" width="160" height="92" rx="10"/>
<path class="code" d="M200 322 l-16 14 l16 14 M272 322 l16 14 l-16 14 M246 318 l-14 36"/>
<path class="ink" d="M132 384 H340 L332 402 Q330 406 324 406 H148 Q142 406 140 402Z"/>
<rect class="face" x="210" y="388" width="52" height="5" rx="2.5"/>

<!-- лапы -->
<circle class="ink" cx="172" cy="372" r="19"/><circle class="face" cx="172" cy="372" r="6"/>
<circle class="ink" cx="352" cy="372" r="19"/><circle class="face" cx="352" cy="372" r="6"/>
</svg>
